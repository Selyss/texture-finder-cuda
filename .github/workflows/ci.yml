name: CI

on:
  push:
  pull_request:

jobs:
  # Unit suite, portable CPU backend end-to-end, and the full differential
  # against the Java reference implementation regenerated from scratch.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Unit tests (real headers, no copies)
        run: make test
      - name: Build CPU backend
        run: make BACKEND=cpu
      - name: End-to-end suite (CPU backend, reduced fixture volume)
        run: FAST=1 BACKEND=cpu ./test/e2e.sh
      - name: Regenerate Java oracle from the reference implementation
        run: test/oracle/regen.sh "$RUNNER_TEMP/oracle"
      - name: Differential against the oracle (~73M values, all 5 modes)
        run: |
          make tools
          ./build/oracle_diff "$RUNNER_TEMP/oracle/dumps"

  # Metal backend build (host code + shader embedding) and unit suite on
  # Apple silicon; the shader itself compiles at runtime, so the smoke run
  # exercises it when the runner exposes a Metal device.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: make test
      - name: Build Metal backend
        run: make BACKEND=metal
      - name: Metal smoke run (skipped result tolerated if runner lacks a GPU)
        continue-on-error: true
        run: ./build/main -108730 -108710 -60 -50 -69740 -69730 0 test/fixtures/formation_a.txt 0
      - name: CPU backend end-to-end (reduced fixture volume)
        run: |
          make clean
          make BACKEND=cpu
          FAST=1 BACKEND=cpu ./test/e2e.sh
